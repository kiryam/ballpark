# Ballpark — IDEX toolhead offset calibration via a ball probe.
# Install: pin + [include tool_offset/*.cfg] + restart klipper. That's it.
# First run: TOOL_SPHERE_CALIBRATE DRY_RUN=1  (ball anywhere in the zone,
# clean nozzles, head-B lane preloaded, axes homed).

[tool_offset_sphere]
pin: ^endstop7

# ---- optional (defaults shown) ----
# ball_top: 0             # ball top height; 0 = auto-discovered on the first
#                         # run (the value is printed - set it to speed up)
# ball_radius: 5          # probe ball radius (D10)
# floor_z: 38             # never probe below this Z (probe body crash guard)
# safe_z_cold: 58         # travel height while ball_top is unknown
# search_center_x: 165    # blind scan zone center/size (shrink for faster
# search_center_y: 35     # cold runs; the ball is placed roughly here)
# search_size_x: 160
# search_size_y: 120
# y_margin: 15           # stay this far from the Y axis limits - the tall
#                         # ball probe can hit the enclosure wall at full
#                         # bed travel
# probe_speed: 4          # mm/s
# travel_speed: 80
# lift_speed: 15
# head_switch_b_gcode: T1 # carriage switch; plain T1/T0 is fine when the
# head_switch_a_gcode: T0 # head-B lane is preloaded
