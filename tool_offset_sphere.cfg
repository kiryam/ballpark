# Ballpark v10 - IDEX toolhead offset calibration via a ball probe.
# Install: pin + [include ballpark/*.cfg] + restart klipper. That's it.
# First run: park the head over the ball, clean nozzles, home, then
#   TOOL_SPHERE_CALIBRATE DRY_RUN=1
# The ball position and height are learned and persisted automatically
# (.ball-state.json) - nothing to configure or re-enter.

[tool_offset_sphere]
pin: ^endstop7

# ---- optional (defaults shown) ----
# ball_radius: 5          # probe ball radius (D10 ball)
# floor_z: 38             # never probe below this Z - probe body guard
# edge_margin: 15         # stay this far from the axis limits
# probe_speed: 4          # mm/s
# travel_speed: 80
# lift_speed: 15
# travel_z_cold: 58       # travel height before the ball top is known
# head_switch_b_gcode: T1 # carriage switch; plain T1/T0 is fine when
# head_switch_a_gcode: T0 # the head-B lane is preloaded
# log_level: 1            # 2 = per-press trace on the console
#
# v8/v9 options (ball_top, search_*, tap_hops_*, nozzle_tip_r, ...) are
# obsolete and ignored - see ANALYSIS.md for why they are gone.
